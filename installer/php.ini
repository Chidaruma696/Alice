; php.ini shipped with Alice (installed as php\php.ini). Relative paths resolve
; against the service working directory, which is the Alice install folder.

[PHP]
extension_dir = "ext"
extension = mbstring
extension = intl
extension = openssl
extension = curl
extension = fileinfo
extension = pdo_mysql
extension = mysqli
extension = pdo_sqlite
extension = sqlite3

; The server detects the Windows time zone through intl when this is empty.
date.timezone =

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "data\logs\php-error.log"
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 128M
max_execution_time = 60
post_max_size = 8M
upload_max_filesize = 8M
default_charset = "UTF-8"
expose_php = Off
